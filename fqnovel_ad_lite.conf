#!name=番茄小说去广告(轻量版)
#!desc=番茄小说广告拦截轻量版：只拦广告专用集群，不 MITM 主 API，零风险。激励视频/Banner/联盟广告/上报全灭，开屏广告可能仍在。
#!author=xinrui-j
#!homepage=https://github.com/xinrui-j/Quantum-x
#!tag=番茄小说,去广告,轻量

# ==========================================================================
#  轻量版（A 档）：只拦广告专用集群，完全不碰正文域名
#
#  订阅：Quantumult X → 设置 → 重写 → 引用 → 右上角 + →
#        https://xinrui-j.github.io/Quantum-x/fqnovel_ad_lite.conf
#
#  适合：不想给主 API 装证书、或完整版导致 App 异常时回退
#  效果：激励视频、Banner、联盟广告、广告上报全灭；
#        开屏广告可能仍在（它走 reading.snssdk.com 主链路，本档不碰）
# ==========================================================================

[rewrite_local]

# 广告专用集群整域拒绝（只走广告，不承载正文，最干净的一刀）
^https?:\/\/(?:ad|ads)\.zijieapi\.com\/ url reject-200
^https?:\/\/ads[35]-normal[a-z-]*\.zijieapi\.com\/ url reject-200

# 巨量激励营销完成回执
^https?:\/\/ad\.zijieapi\.com\/api\/incentive\/marketing\/done url reject-200

# 广告落地页 / 开屏互动设置页 / 橙子建站
^https?:\/\/ad-experience\.bytedance\.com\/ url reject-200
^https?:\/\/www\.chengzijianzhan\.com\/site_preload\/info url reject-200

# 广告 JSSDK 埋点
^https?:\/\/lf3-analytics\.bytescm\.com\/obj\/adjssdk\/ url reject-200

# 抖音开放接口里的广告举报页与 CPM 上报
^https?:\/\/aweme\.snssdk\.com\/falcon\/fe_douyin_ad_react\/ url reject-200
^https?:\/\/aweme\.snssdk\.com\/aweme\/open\/export_sdk\/report_ad_cpm url reject-200
^https?:\/\/aweme\.snssdk\.com\/aweme\/open\/export_sdk\/dislike\/item url reject-200


[mitm]
hostname = %APPEND% ad.zijieapi.com, ads.zijieapi.com, ads3-normal.zijieapi.com, ads5-normal.zijieapi.com, ads3-normal-hl.zijieapi.com, ads3-normal-lf.zijieapi.com, ads3-normal-lq.zijieapi.com, ads5-normal-hl.zijieapi.com, ads5-normal-lf.zijieapi.com, ads5-normal-lq.zijieapi.com, ad-experience.bytedance.com, www.chengzijianzhan.com, lf3-analytics.bytescm.com, aweme.snssdk.com
