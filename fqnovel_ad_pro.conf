#!name=番茄小说 去广告
#!desc=广告域名整域拒绝 + 正文插页广告标记重置。MITM 精确到 9 个主 API 域名，不使用通配。
#!author=xinrui-j
#!homepage=https://github.com/xinrui-j/Quantum-x
#!tag=番茄小说,去广告

# ==========================================================================
#  番茄小说 去广告
#
#  订阅：Quantumult X → 设置 → 重写 → 引用 → 右上角 + →
#        https://xinrui-j.github.io/Quantum-x/fqnovel_ad_pro.conf
#
#  ── 为什么不用 *.fqnovel.com 通配 ────────────────────────────────────
#  通配会把该域下**每一个**子域都拉进 MITM，包括各类 CDN 与媒体域名。
#  其中只要有证书校验或非标准链，握手就失败，整条链路超时 ——
#  就是你遇到的「一点网没有」「评论加载不出来」。
#  这里改成 9 个精确的 API 域名，只解密真正跑业务接口的那几个。
#
#  ── 关于「把广告和正常内容分开」────────────────────────────────────
#  正文里的插页广告不是独立请求，它和正文数据在**同一个 JSON 响应**里：
#      paragraphs: [ {正文...}, {read_flow_ad_type: 3, ad_info: {...}}, {正文...} ]
#  所以无法在网络层「按域名区分」——只能读这份 JSON，把广告项的标记改掉。
#
#  改法刻意做得最保守：不删字段、不删数组项、不重建 JSON，
#  只把 read_flow_ad_type 的值从非 0 改成 0（客户端据此不渲染广告视图）。
#  JSON 结构、字段个数、顺序、19 位 int64 精度全部原样保留。
#  之前删字段导致「网络出错」的坑就是这么来的，这次不会再碰结构。
#
#  ── 如果 App 又出问题 ───────────────────────────────────────────────
#  把 [mitm] 里下面这 9 行删掉（保留 13 个广告域名），
#  就回到你已经验证可用的状态，功能立刻恢复：
#      api.fqnovel.com, api3-normal-hl/lf/lq, api5-normal-hl/lf/lq, api3-normal, api5-normal
# ==========================================================================

[rewrite_local]

# ① 广告专用集群整域拒绝
^https?:\/\/(?:ad|ads)\.zijieapi\.com(?:\/|$|\?) url reject-200
^https?:\/\/ads[35]-normal[a-z-]*\.zijieapi\.com(?:\/|$|\?) url reject-200

# ② 主 API 上的广告路径（只砍 /api/ad/ 前缀，正文接口不受影响）
^https?:\/\/[^\/]+\/api\/ad(?:\/|$|\?) url reject-200

# ③ 广告落地页 / 橙子建站 / 广告 JSSDK
^https?:\/\/ad-experience\.bytedance\.com\/ url reject-200
^https?:\/\/www\.chengzijianzhan\.com\/site_preload\/info url reject-200
^https?:\/\/lf3-analytics\.bytescm\.com\/obj\/adjssdk\/ url reject-200

# ④ 章末 / 剧集插页广告（在业务域名上，靠 ② 之外的这条覆盖）
^https?:\/\/[^\/]+\/reading\/commerceapi\/ad(?:\/|$|\?) url reject-200

# ⑤ 正文翻页插页广告：只重置广告标记，不改结构
#    你截图那两种（漫剧推广 / 抖音内容 / 听书推广）都走这个字段。
#    read_flow_ad_type 非 0 = 这一段是广告位，改成 0 客户端就不渲染。
#
#    ⚠️ 脚本要生效，请求的域名必须在 [mitm] 里，否则 QX 不解密、脚本不执行。
#       /reading/reader/full/ 可能落在 api*.fqnovel.com，也可能落在
#       reading.snssdk.com —— 后者本版已加回 MITM。
^https?:\/\/[^\/]+\/reading\/reader\/(?:batch_)?full url script-response-body https://xinrui-j.github.io/Quantum-x/scripts/fqnovel_ad_flow.js


[mitm]
hostname = %APPEND% ad.zijieapi.com, ads.zijieapi.com, ads3-normal.zijieapi.com, ads5-normal.zijieapi.com, ads3-normal-hl.zijieapi.com, ads3-normal-lf.zijieapi.com, ads3-normal-lq.zijieapi.com, ads5-normal-hl.zijieapi.com, ads5-normal-lf.zijieapi.com, ads5-normal-lq.zijieapi.com, ad-experience.bytedance.com, www.chengzijianzhan.com, lf3-analytics.bytescm.com, api.fqnovel.com, api3-normal.fqnovel.com, api5-normal.fqnovel.com, api3-normal-hl.fqnovel.com, api3-normal-lf.fqnovel.com, api3-normal-lq.fqnovel.com, api5-normal-hl.fqnovel.com, api5-normal-lf.fqnovel.com, api5-normal-lq.fqnovel.com, reading.snssdk.com, reading-hl.snssdk.com, reading-lq.snssdk.com
