#!name=番茄小说 & 红果短剧 去广告
#!desc=字节阅读系双端通用：开屏、激励视频、Banner、联盟广告、章末插页、剧集插播、信息流广告卡全部拦截。基于 Eggplant 与 Reading 主二进制逆向。
#!author=xinrui-j
#!homepage=https://github.com/xinrui-j/Quantum-x
#!tag=番茄小说,红果短剧,去广告

# ==========================================================================
#  番茄小说 + 红果短剧 通用去广告（彻底版）
#
#  订阅：Quantumult X → 设置 → 重写 → 引用 → 右上角 + →
#        https://xinrui-j.github.io/Quantum-x/fqnovel_ad_pro.conf
#
#  为什么一份规则能通吃两端：
#    两个 App 是同一代码基线的双产品（Reading.app / Eggplant.app，同为 7.4.3）
#    · tnc.json 83 个域名零差异
#    · 广告接口 151 条零差异
#    · 广告字段出现次数逐个相同（ad_insert_interval 1/1、chapter_end_ad 8/8、
#      read_flow_ad_type 4/4、api/ad/v1/inspire 2/2 ...）
#
#  依赖：
#    ① 脚本与本订阅同域，走 Pages：
#       https://xinrui-j.github.io/Quantum-x/scripts/fqnovel_ad_clean.js
#    ② QX 里已生成并安装 MitM 证书，并到
#       「设置 → 通用 → 关于本机 → 证书信任设置」打开信任开关。
#
#  覆盖的广告形态：
#    · 开屏广告          /api/ad/splash/*
#    · 激励视频          /api/ad/v1/inspire/（短剧解锁、书币任务都走这里）
#    · 联盟/Banner       /api/ad/union/sdk/get_ads/、/api/ad/v1/banner/
#    · 广告上报          /api/ad/v1/report/
#    · 章末/剧集插页      /reading/commerceapi/ad/*              整族拒绝
#    · 章末卡片位广告     /reading/commerceapi/chapter_end/resource/  脚本洗卡，保留评论推荐
#    · 正文段落插入广告   /reading/reader/full/                 脚本按 read_flow_ad_type 删段
#    · 书城/搜索广告卡    bookmall/cell/change、search/tab       脚本删卡
#    · 看广告得书币入口   luckycat excitation_ad_*             整族拒绝（要奖励就注释掉 ⑫⑬）
#
#  脚本拉不到时的表现：拦截规则照常生效，只是不洗响应体 —— QX 不报错，
#  你只会发现章末卡片位和书城里的广告卡还在。自查：
#    curl -I https://xinrui-j.github.io/Quantum-x/scripts/fqnovel_ad_clean.js
# ==========================================================================

[rewrite_local]

# ① 广告专用集群整域拒绝（两端的 ads 集群完全相同）
#    兼容三种形态：带路径 /api/ad/...、裸域名、带 query
^https?:\/\/(?:ad|ads)\.zijieapi\.com(?:\/|$|\?) url reject-200
^https?:\/\/ads[35]-normal[a-z-]*\.zijieapi\.com(?:\/|$|\?) url reject-200

# ② 主 API 路径层拦截：只砍 /api/ad/，正文与剧集接口不受影响
#    覆盖开屏、预加载、联盟、Banner、聚合、recall、dislike、report、
#    ack/splash、feedback/privacy、personality_switch 共 21 条
#
#    ⚠️ 关键：用负向断言排除 /api/ad/v1/inspire（含 inspire_send）
#    红果短剧的免费集数靠「看广告解锁」，这条是解锁状态机的一部分。
#    把它整条 reject 成空 body，客户端解析不到字段就会卡在解锁中 —— 表现为不能播放。
#    放行它的后果：客户端认为「有广告任务」→ 去 /api/ad/union/sdk/get_ads/ 和
#    /api/ad/v1/banner/ 拉素材 → 这两条已被拦 → 拿不到素材 → 降级跳过广告直接解锁。
#    这正是我们要的效果：解锁正常、广告不出现。
^https?:\/\/[^\/]+\/api\/ad(?!\/v1\/inspire)(?:\/|$|\?) url reject-200

# ③ 巨量激励营销完成回执
^https?:\/\/ad\.zijieapi\.com\/api\/incentive\/marketing\/done url reject-200

# ④ 广告落地页 / 开屏互动设置页 / 橙子建站
^https?:\/\/ad-experience\.bytedance\.com\/ url reject-200
^https?:\/\/www\.chengzijianzhan\.com\/site_preload\/info url reject-200

# ⑤ 广告 JSSDK 埋点
^https?:\/\/lf3-analytics\.bytescm\.com\/obj\/adjssdk\/ url reject-200

# ⑥ 抖音开放接口里的广告举报页、广告任务上报与 CPM 上报
^https?:\/\/aweme\.snssdk\.com\/falcon\/fe_douyin_ad_react\/ url reject-200
^https?:\/\/aweme\.snssdk\.com\/ad\/mission\/ url reject-200
^https?:\/\/aweme\.snssdk\.com\/aweme\/open\/export_sdk\/report_ad_cpm url reject-200
^https?:\/\/aweme\.snssdk\.com\/aweme\/open\/export_sdk\/dislike\/item url reject-200

# ⑦ 章末 / 剧集插页广告：整族拒绝
#    comment=章末评论区广告位 / mix_game=章末小游戏 / delivery_plan=投放计划
#    patch_plan=补丁计划 / feature=特性开关 / report=曝光上报 / auth_benefit=广告权益
^https?:\/\/[^\/]+\/reading\/commerceapi\/ad(?:\/|$|\?) url reject-200

# ⑧ 章末资源位：不能整条 reject（会连评论、推荐、优惠券一起干掉）
#    交给脚本按广告特征删卡片，其余原样保留
^https?:\/\/[^\/]+\/reading\/commerceapi\/chapter_end\/resource\/ url script-response-body https://xinrui-j.github.io/Quantum-x/scripts/fqnovel_ad_clean.js

# ⑨ 书城「换一换」与搜索结果里混入的广告卡
^https?:\/\/[^\/]+\/reading\/bookapi\/bookmall\/cell\/change\/ url script-response-body https://xinrui-j.github.io/Quantum-x/scripts/fqnovel_ad_clean.js
^https?:\/\/[^\/]+\/reading\/bookapi\/search\/tab\/ url script-response-body https://xinrui-j.github.io/Quantum-x/scripts/fqnovel_ad_clean.js

# ⑩ 正文/剧集内容：不挂脚本（性能与稳定优先）
#    原先在这里挂 script-response-body 清洗 read_flow_ad_type 广告段，实测两个问题：
#      · 番茄每翻一页跑一次 JSON 往返，QX 的 JSC 处理几百 KB body 明显卡顿
#      · 红果剧集内容走同一族接口，脚本改写后播放器拿到的数据异常
#    已移除。正文里的广告位本身是从 /api/ad/ 拉素材的，素材接口已被 ② 拦掉，
#    广告位渲染为空，不需要再动内容本身。
# 若你确实想连内联广告段一起删（且能接受卡顿），取消下面两行注释：
# ^https?:\/\/[^\/]+\/reading\/reader\/full\/ url script-response-body https://xinrui-j.github.io/Quantum-x/scripts/fqnovel_ad_clean.js
# ^https?:\/\/[^\/]+\/reading\/reader\/batch_full\/ url script-response-body https://xinrui-j.github.io/Quantum-x/scripts/fqnovel_ad_clean.js

# ⑫ 看广告得书币的任务入口：整族拒绝
#    覆盖 /task/get_ad_info、/task/done/excitation_ad_*、/task/excitation_ad_right/detail
#    （二进制里的权益标识：excitation_ad_right_signin / _listen / _short_video / _meal /
#      excitation_ad_before_signin_completed / excitation_ad_pre_sign_in_popup ...）
#    断掉后广告彻底消失，代价是书币宝箱 / 看广告换时长这些任务也没了。
#    想要奖励就注释掉这两行（广告会重新出现）。
^https?:\/\/[^\/]+\/luckycat\/novel\/v1\/task\/get_ad_info url reject-200
^https?:\/\/[^\/]+\/luckycat\/novel\/v1\/task\/(?:done\/)?excitation_ad url reject-200

# ⑬ 广告评价上报 + 阅读奖励广告位
^https?:\/\/[^\/]+\/luckycat\/novel\/v1\/report\/ad_comment url reject-200
^https?:\/\/[^\/]+\/reading\/reader\/bonus\/ad_reward\/ url reject-200


[mitm]
hostname = %APPEND% ad.zijieapi.com, ads.zijieapi.com, ads3-normal.zijieapi.com, ads5-normal.zijieapi.com, ads3-normal-hl.zijieapi.com, ads3-normal-lf.zijieapi.com, ads3-normal-lq.zijieapi.com, ads5-normal-hl.zijieapi.com, ads5-normal-lf.zijieapi.com, ads5-normal-lq.zijieapi.com, ad-experience.bytedance.com, www.chengzijianzhan.com, lf3-analytics.bytescm.com, fqnovel.com, *.fqnovel.com, reading.snssdk.com, reading-hl.snssdk.com, reading-lq.snssdk.com, i.snssdk.com, i-hl.snssdk.com, i-lq.snssdk.com, ib.snssdk.com, is.snssdk.com, ic.snssdk.com, aweme.snssdk.com
