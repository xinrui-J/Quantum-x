#!desc=MITM 只覆盖纯广告域名，不碰任何业务域名。用于确认环境正常后再逐步加强。
#!author=xinrui-j
#!homepage=https://github.com/xinrui-j/Quantum-x
#!tag=番茄小说,去广告

# ==========================================================================
#  番茄小说 去广告 · 安全基线
#
#  订阅：Quantumult X → 设置 → 重写 → 引用 → 右上角 + →
#        https://xinrui-j.github.io/Quantum-x/fqnovel_ad_pro.conf
#
#  ── 为什么退回这一版 ───────────────────────────────────────────────
#  「没冷启动时看着正常，冷启动后听书一点网没有、评论加载不出来」
#  → 说明问题不在拦了哪个接口，而在 **MITM 解密范围**。
#
#  只要列表里出现业务域名，QX 就要对这些域名的每一个 HTTPS 请求做
#  中间人解密。一旦某个域名存在证书校验（certificate pinning）或用了
#  非标准证书链，握手就会失败 —— 该域名下的所有请求全部超时，
#  表现为「一点网没有」。
#
#  ── 这一版做了什么 ─────────────────────────────────────────────────
#  MITM 名单里**只有纯广告域名**，一个业务域名都不碰：
#    ad.zijieapi.com / ads*.zijieapi.com   ← TNC 下发的广告专用集群
#    ad-experience.bytedance.com           ← 开屏广告互动设置页
#    www.chengzijianzhan.com               ← 橙子建站（广告主落地页）
#    lf3-analytics.bytescm.com             ← 广告 JSSDK 埋点
#
#  这些域名只跑广告，不承载正文、音频、评论、登录任何业务。
#  把它们解密拦截，不可能影响 App 功能。
#
#  ── 效果 ───────────────────────────────────────────────────────────
#  ✅ 开屏广告、激励视频、Banner、联盟广告、广告上报 —— 全灭
#  ⚠️ 章末插页广告、正文翻页插页、书城广告卡 —— 不处理
#     （它们跑在 api*.fqnovel.com 上，要拦就必须 MITM 业务域名，
#       而那正是导致「一点网没有」的原因）
#
#  ── 下一步 ─────────────────────────────────────────────────────────
#  如果这一版冷启动后：
#    · 听书、评论、正文全部正常  → 说明业务域名的 MITM 确实是元凶，
#      再逐个子域测试哪些可以安全解密（一次只加一个，冷启动验证）
#    · 仍然一点网没有            → 问题在 QX 本身或证书，与本规则无关，
#      把整条订阅禁用后再测一次即可确认
# ==========================================================================

[rewrite_local]

# 广告专用集群整域拒绝
^https?:\/\/(?:ad|ads)\.zijieapi\.com(?:\/|$|\?) url reject-200
^https?:\/\/ads[35]-normal[a-z-]*\.zijieapi\.com(?:\/|$|\?) url reject-200

# 开屏广告互动设置页
^https?:\/\/ad-experience\.bytedance\.com\/ url reject-200

# 橙子建站（广告主落地页托管）
^https?:\/\/www\.chengzijianzhan\.com\/site_preload\/info url reject-200

# 广告 JSSDK 埋点
^https?:\/\/lf3-analytics\.bytescm\.com\/obj\/adjssdk\/ url reject-200


[mitm]
hostname = %APPEND% ad.zijieapi.com, ads.zijieapi.com, ads3-normal.zijieapi.com, ads5-normal.zijieapi.com, ads3-normal-hl.zijieapi.com, ads3-normal-lf.zijieapi.com, ads3-normal-lq.zijieapi.com, ads5-normal-hl.zijieapi.com, ads5-normal-lf.zijieapi.com, ads5-normal-lq.zijieapi.com, ad-experience.bytedance.com, www.chengzijianzhan.com, lf3-analytics.bytescm.com
