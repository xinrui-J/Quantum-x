#!name=番茄小说去广告(完整版)
#!desc=番茄小说 7.4.3 广告拦截：开屏/激励视频/Banner/联盟广告/广告上报。基于主二进制与 tnc.json 逆向提取的 33 域名 39 接口。
#!author=xinrui-j
#!homepage=https://github.com/xinrui-j/Quantum-x
#!tag=番茄小说,去广告,字节

# ==========================================================================
#  完整版（B 档）：MITM 主 API，连开屏广告一起干掉
#
#  订阅：Quantumult X → 设置 → 重写 → 引用 → 右上角 + →
#        https://xinrui-j.github.io/Quantum-x/fqnovel_ad.conf
#
#  前提：QX 里已生成并安装 MitM 证书，且到
#        「设置 → 通用 → 关于本机 → 证书信任设置」里打开了信任开关。
#
#  只想要零风险版本（不碰正文域名）→ 改订阅 fqnovel_ad_lite.conf
#  想要连书城搜索流里的广告卡一起删 → 改订阅 fqnovel_ad_pro.conf
# ==========================================================================

[rewrite_local]

# ① 广告专用集群整域拒绝（TNC 下发的广告专属集群，不承载正文）
^https?:\/\/(?:ad|ads)\.zijieapi\.com\/ url reject-200
^https?:\/\/ads[35]-normal[a-z-]*\.zijieapi\.com\/ url reject-200

# ② 主 API 路径层拦截：只砍 /api/ad/ 前缀，正文接口不受影响
#    覆盖二进制里全部 23 条广告接口：
#    开屏 /api/ad/splash/*（novelapp/v15、get_atp_config、stock/realtime、stat/ack、splash_shake_switch）
#    预加载 /api/ad/preload_ad/v3/、联盟 /api/ad/union/sdk/get_ads/
#    激励 /api/ad/v1/inspire/、inspire_send、banner、aggregate、recall_ads、dislike、report
#    v1|v2 ack/splash、feedback/privacy、personality_switch
^https?:\/\/[^\/]+\/api\/ad(?:\/|$|\?) url reject-200

# ③ 巨量激励营销完成回执
^https?:\/\/ad\.zijieapi\.com\/api\/incentive\/marketing\/done url reject-200

# ④ 广告落地页 / 开屏互动设置页 / 橙子建站
^https?:\/\/ad-experience\.bytedance\.com\/ url reject-200
^https?:\/\/www\.chengzijianzhan\.com\/site_preload\/info url reject-200

# ⑤ 广告 JSSDK 埋点（event_sdk_for_external.js）
^https?:\/\/lf3-analytics\.bytescm\.com\/obj\/adjssdk\/ url reject-200

# ⑥ 抖音开放接口里的广告举报页与 CPM 上报
^https?:\/\/aweme\.snssdk\.com\/falcon\/fe_douyin_ad_react\/ url reject-200
^https?:\/\/aweme\.snssdk\.com\/aweme\/open\/export_sdk\/report_ad_cpm url reject-200
^https?:\/\/aweme\.snssdk\.com\/aweme\/open\/export_sdk\/dislike\/item url reject-200


[mitm]
hostname = %APPEND% ad.zijieapi.com, ads.zijieapi.com, ads3-normal.zijieapi.com, ads5-normal.zijieapi.com, ads3-normal-hl.zijieapi.com, ads3-normal-lf.zijieapi.com, ads3-normal-lq.zijieapi.com, ads5-normal-hl.zijieapi.com, ads5-normal-lf.zijieapi.com, ads5-normal-lq.zijieapi.com, ad-experience.bytedance.com, www.chengzijianzhan.com, lf3-analytics.bytescm.com, fqnovel.com, *.fqnovel.com, reading.snssdk.com, reading-hl.snssdk.com, reading-lq.snssdk.com, i.snssdk.com, ib.snssdk.com, is.snssdk.com, ic.snssdk.com, aweme.snssdk.com
