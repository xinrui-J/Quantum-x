#!name=【诊断用】番茄红果 极小规则集
#!desc=只拦纯广告域名，完全不 MITM 业务接口、不挂任何脚本。用于判断问题出在规则还是环境。
#!author=xinrui-j
#!homepage=https://github.com/xinrui-j/Quantum-x
#!tag=诊断,去广告

# ==========================================================================
#  这是诊断用的最小规则集，不是正式版。
#
#  目的：把变量降到最少，用来回答一个问题 ——
#        「是我写的规则有问题，还是你的 QX 环境有问题？」
#
#  本文件只做三件事：
#    1. 拒绝广告专用集群 ad/ads*.zijieapi.com（这组域名只跑广告，不承载任何业务）
#    2. 拒绝开屏广告互动设置页 ad-experience.bytedance.com
#    3. MITM 只声明上面这些广告域名，业务域名一个都不碰
#
#  本文件绝对不做的事：
#    ✗ 不 MITM api.fqnovel.com / reading.snssdk.com / i.snssdk.com 等业务域名
#    ✗ 不拦任何 /api/ad/ 路径
#    ✗ 不挂任何脚本
#    ✗ 不改任何响应体
#
#  预期效果：开屏、激励视频、Banner、联盟广告会消失；
#            正文插页广告、章末广告仍在（本版本不处理）。
#            但 App 功能应该 100% 正常。
#
#  怎么看结果：
#    能正常用 → 说明我的 path 拦截或脚本有问题，继续往下排查
#    还是不行 → 说明问题在 MITM 证书或 QX 配置，跟规则无关
# ==========================================================================

[rewrite_local]

^https?:\/\/(?:ad|ads)\.zijieapi\.com(?:\/|$|\?) url reject-200
^https?:\/\/ads[35]-normal[a-z-]*\.zijieapi\.com(?:\/|$|\?) url reject-200
^https?:\/\/ad-experience\.bytedance\.com\/ url reject-200


[mitm]
hostname = %APPEND% ad.zijieapi.com, ads.zijieapi.com, ads3-normal.zijieapi.com, ads5-normal.zijieapi.com, ads3-normal-hl.zijieapi.com, ads3-normal-lf.zijieapi.com, ads3-normal-lq.zijieapi.com, ads5-normal-hl.zijieapi.com, ads5-normal-lf.zijieapi.com, ads5-normal-lq.zijieapi.com, ad-experience.bytedance.com
